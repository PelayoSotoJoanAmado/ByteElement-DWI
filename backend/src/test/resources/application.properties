spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:stockguard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${TEST_DB_USER:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
stockguard.jwt.secret=test-only-signing-key-at-least-thirty-two-bytes
stockguard.jwt.issuer=stockguard
stockguard.jwt.ttl-minutes=30
stockguard.bootstrap.username=test-admin
stockguard.bootstrap.password=OnlyForAutomatedTests123!
stockguard.demo.password=
