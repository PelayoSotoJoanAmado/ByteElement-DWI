spring.application.name=stockguard

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockguard}
spring.datasource.username=${DB_USER:stockguard}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

stockguard.jwt.secret=${JWT_SECRET:}
stockguard.jwt.issuer=stockguard
stockguard.jwt.ttl-minutes=30
stockguard.bootstrap.username=${BOOTSTRAP_USER:administrador}
stockguard.bootstrap.password=${BOOTSTRAP_PASSWORD:}
stockguard.demo.password=${DEMO_PASSWORD:}
# Reglas APF3 (escenario academico, parametrizadas por ambiente).
stockguard.reposicion.ventana-dias=30
stockguard.reposicion.plazo-dias=7
stockguard.reposicion.seguridad-dias=3
stockguard.cors.origenes=${CORS_ORIGINS:http://localhost:4200}
# Evitar logs de cuerpos HTTP, passwords y JWT en entornos compartidos.
logging.level.org.springframework.web=INFO

# Primera instalacion: cinco cuentas, cinco passwords privados distintos, sin datos demo.
stockguard.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
stockguard.bootstrap.almacen.username=${BOOTSTRAP_ALMACEN_USER:almacen}
stockguard.bootstrap.almacen.password=${BOOTSTRAP_ALMACEN_PASSWORD:}
stockguard.bootstrap.compras.username=${BOOTSTRAP_COMPRAS_USER:compras}
stockguard.bootstrap.compras.password=${BOOTSTRAP_COMPRAS_PASSWORD:}
stockguard.bootstrap.supervisor.username=${BOOTSTRAP_SUPERVISOR_USER:supervisor}
stockguard.bootstrap.supervisor.password=${BOOTSTRAP_SUPERVISOR_PASSWORD:}
stockguard.bootstrap.consulta.username=${BOOTSTRAP_CONSULTA_USER:consulta-comercial}
stockguard.bootstrap.consulta.password=${BOOTSTRAP_CONSULTA_PASSWORD:}
