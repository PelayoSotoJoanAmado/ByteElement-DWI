spring.application.name=stockguard

spring.profiles.active=local,demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockguard}
spring.datasource.username=${DB_USER:stockguard}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

stockguard.jwt.secret=${JWT_SECRET:}
stockguard.jwt.issuer=stockguard
stockguard.jwt.ttl-minutes=30
stockguard.bootstrap.username=${BOOTSTRAP_USER:}
stockguard.bootstrap.password=${BOOTSTRAP_PASSWORD:}
stockguard.demo.password=${DEMO_PASSWORD:}