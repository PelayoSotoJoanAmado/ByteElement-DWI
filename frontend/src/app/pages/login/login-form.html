<section class="login-card" aria-labelledby="login-title">
  <a class="card-brand brand" routerLink="/" aria-label="StockGuard, presentación del sistema"
    ><app-icon name="shield" />StockGuard</a
  >
  <h2 id="login-title">Bienvenido de vuelta</h2>
  <p class="login-description">Inicia sesión para continuar en StockGuard.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate [attr.aria-busy]="submitting()">
    <div class="form-field">
      <label for="username">Usuario</label>
      <div class="input-shell" [class.input-invalid]="invalid('username')">
        <app-icon name="user" />
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          maxlength="80"
          placeholder="Ingresa tu usuario"
          [readOnly]="submitting()"
          [attr.aria-invalid]="invalid('username')"
          [attr.aria-describedby]="invalid('username') ? 'username-error' : null"
        />
      </div>
      @if (invalid('username')) {
        <p id="username-error" class="field-error">Ingresa tu usuario.</p>
      }
    </div>
    <div class="form-field">
      <label for="password">Contraseña</label>
      <div class="input-shell" [class.input-invalid]="invalid('password')">
        <app-icon name="lock" />
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          maxlength="72"
          placeholder="Ingresa tu contraseña"
          [readOnly]="submitting()"
          [attr.aria-invalid]="invalid('password')"
          [attr.aria-describedby]="invalid('password') ? 'password-error' : null"
        />
        <button
          class="password-toggle"
          type="button"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="showPassword()"
          aria-controls="password"
          (click)="showPassword.set(!showPassword())"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
        </button>
      </div>
      @if (invalid('password')) {
        <p id="password-error" class="field-error">Ingresa tu contraseña.</p>
      }
    </div>
    @if (error()) {
      <div class="login-error" role="alert">
        <app-icon name="alert" />
        <p>{{ error() }}</p>
      </div>
    }
    <button class="button button-primary submit-button" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <span class="spinner" aria-hidden="true"></span>Iniciando sesión…
      } @else {
        Iniciar sesión <app-icon name="arrow" />
      }
    </button>
  </form>
</section>
