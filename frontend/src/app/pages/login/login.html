<div class="login-page">
  <img
    class="login-background"
    src="images/warehouse-hero.webp"
    alt=""
    width="1672"
    height="941"
    fetchpriority="high"
  />
  <div class="login-layout">
    <header class="login-header">
      <a class="brand" routerLink="/" aria-label="StockGuard, volver a la presentación"
        ><app-icon name="shield" />StockGuard</a
      >
      <a class="back-link" routerLink="/"><app-icon name="arrow" />Volver a la presentación</a>
    </header>
    <main class="login-main">
      <section class="login-intro" aria-labelledby="intro-title">
        <h1 id="intro-title">El control <br />empieza <br /><span>contigo.</span></h1>
        <p>Ingresa y mantén tus operaciones conectadas.</p>
        <ul class="login-benefits" aria-label="StockGuard conecta tus operaciones">
          <li><app-icon name="box" />Inventario</li>
          <li><app-icon name="cart" />Compras</li>
          <li><app-icon name="arrows" />Control</li>
        </ul>
      </section>
      <app-login-form />
    </main>
    <footer class="login-footer">© {{ year }} StockGuard</footer>
  </div>
</div>
